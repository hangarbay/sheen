name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          exe=""
          if [ "${GOOS}" = "windows" ]; then exe=".exe"; fi
          stage="sheen_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${stage}"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${version}" \
            -o "dist/${stage}/sheen${exe}" ./cmd/sheen
          cp README.md LICENSE "dist/${stage}/"
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -qr "${stage}.zip" "${stage}")
          else
            tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sheen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sheen_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
